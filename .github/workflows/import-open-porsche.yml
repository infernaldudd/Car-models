name: Import open-license vintage 911 reference mesh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-open-porsche.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch third-party 930 model and textures
        run: |
          git clone --depth 1 https://github.com/UtkarshPathrabe/Porche-911-930-Turbo-1975-3D-Model.git /tmp/porsche-source
          dest="third_party/Porsche_911_930_Turbo_1975"
          mkdir -p "$dest/textures"
          cp /tmp/porsche-source/scene.gltf /tmp/porsche-source/scene.bin "$dest/"
          cp /tmp/porsche-source/textures/* "$dest/textures/"
          cp /tmp/porsche-source/LICENSE "$dest/SOURCE_REPOSITORY_LICENSE.txt"
          test -s "$dest/scene.gltf" && test -s "$dest/scene.bin"
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('third_party/Porsche_911_930_Turbo_1975')
          scene=json.loads((d/'scene.gltf').read_text())
          missing=[]
          for i in scene.get('images',[]):
              uri=i.get('uri','')
              if uri and not (d/uri).exists(): missing.append(uri)
          assert not missing, f'Missing texture files: {missing}'
          buffers=scene.get('buffers',[])
          for b in buffers:
              uri=b.get('uri','')
              if uri: assert (d/uri).exists(), uri
          print('Valid glTF file reference paths; textures:',len(scene.get('images',[])))
          PY
      - name: Commit import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/Porsche_911_930_Turbo_1975/
          if ! git diff --cached --quiet; then
            git commit -m "Import credited 1975 911 930 vintage reference mesh and PBR textures"
            git push
          fi
