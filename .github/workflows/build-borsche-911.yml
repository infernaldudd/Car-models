name: Build Borsche 911 1981 smooth 3D assets
on:
  push:
    paths:
      - "Borsche_911_1981/source/build_borsche.py.zlib.b64"
      - ".github/workflows/build-borsche-911.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modeling dependencies
        run: python -m pip install --prefer-binary "numpy>=1.25" "scipy>=1.11" "trimesh>=4.0" "Pillow>=10" networkx
      - name: Reconstruct editable source
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          root=pathlib.Path('Borsche_911_1981')
          src=root / 'source' / 'build_borsche.py.zlib.b64'
          dst=root / 'build_borsche.py'
          data=zlib.decompress(base64.b64decode(src.read_text().strip()))
          assert b'def construct_scene' in data and b'def export_all' in data
          dst.write_bytes(data)
          print(f'Restored {dst}, {len(data)} bytes')
          PY
      - name: Generate smooth closed, open-lid, and engine-only GLB exports
        run: |
          cd Borsche_911_1981
          OPENBLAS_NUM_THREADS=1 python build_borsche.py
      - name: Validate generated GLB assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh
          folder=Path('Borsche_911_1981')
          paths=list(folder.glob('Borsche_911_1981_Smooth_*.glb'))
          assert len(paths)==3, paths
          for p in sorted(paths):
              s=trimesh.load(p,force='scene')
              assert len(s.geometry)>0
              triangles=sum(len(g.faces) for g in s.geometry.values())
              assert triangles>5000, (p,triangles)
              print(f'{p}: {triangles:,} triangles; {len(s.geometry)} mesh groups; {p.stat().st_size:,} bytes')
          PY
      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Borsche_911_1981/build_borsche.py Borsche_911_1981/Borsche_911_1981_Asset_Info.json Borsche_911_1981/Borsche_911_1981_Smooth_Closed.glb Borsche_911_1981/Borsche_911_1981_Smooth_Engine_Open.glb Borsche_911_1981/Borsche_911_1981_Smooth_Flat_Six_Engine.glb
          if git diff --cached --quiet; then
            echo "Generated assets already up to date"
          else
            git commit -m "Generate smooth Borsche 911 1981 car and flat-six GLB files"
            git push
          fi
