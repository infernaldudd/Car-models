name: Import 5 CC-commercial Porsche sports car GLBs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import_cc_sports_batch02.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download and verify pinned artist-licensed GLB assets
        run: |
          python - <<'PY'
          import os, json, pathlib, hashlib, subprocess, urllib.request
          root=pathlib.Path("third_party/Sports_Batch_02")
          d=json.loads((root/"PROVENANCE.json").read_text())
          for m in d["models"]:
              out=root/m["folder"]/"source_meshopt.glb"
              out.parent.mkdir(parents=True,exist_ok=True)
              url="https://raw.githubusercontent.com/pedrosoandre/carros/"+d["upstream_commit"]+"/assets/"+m["source_file"]
              urllib.request.urlretrieve(url,out)
              assert out.stat().st_size==m["size"],(out,out.stat().st_size,m["size"])
              sha=subprocess.check_output(["git","hash-object",str(out)],text=True).strip()
              assert sha==m["sha"],(out,sha,m["sha"])
              assert out.read_bytes()[:4]==b"glTF",out
              print("Validated",out, "size=",out.stat().st_size,"sha=",sha)
          PY
      - name: Install glTF decoding utilities
        run: |
          npm install --prefix /tmp/gltfdecode --no-audit --no-fund @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 meshoptimizer@0.22.0
      - name: Decode meshopt into standard uncompressed GLB
        run: |
          cat > /tmp/gltfdecode/decode.mjs <<'JS'
          import { NodeIO } from '@gltf-transform/core';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import { MeshoptDecoder } from 'meshoptimizer';
          import fs from 'node:fs';
          import path from 'node:path';
          await MeshoptDecoder.ready;
          const io = new NodeIO().registerExtensions(ALL_EXTENSIONS).registerDependencies({ 'meshopt.decoder': MeshoptDecoder });
          const root=process.cwd()+'/third_party/Sports_Batch_02';
          const data=JSON.parse(fs.readFileSync(root+'/PROVENANCE.json','utf8'));
          for (const item of data.models) {
            const input=path.join(root,item.folder,'source_meshopt.glb');
            const output=path.join(root,item.folder,'model.glb');
            const doc=await io.read(input);
            for (const ext of [...doc.getRoot().listExtensionsUsed()]) if(ext.extensionName==='EXT_meshopt_compression') ext.dispose();
            await io.write(output,doc);
            const bytes=fs.statSync(output).size;
            if(bytes < 50000) throw new Error('Unreasonably small model: '+output);
            console.log(item.folder+' standard GLB '+bytes+' bytes; meshes '+doc.getRoot().listMeshes().length);
          }
          JS
          node /tmp/gltfdecode/decode.mjs
      - name: Validate uncompressed models and prepare mechanical QA metrics
        run: |
          python - <<'PY'
          import pathlib,json,struct
          root=pathlib.Path("third_party/Sports_Batch_02")
          info=json.loads((root/"PROVENANCE.json").read_text())
          reports=[]
          for item in info["models"]:
            p=root/item["folder"]/"model.glb"
            raw=p.read_bytes()
            magic,version,size=struct.unpack_from("<4sII",raw,0)
            assert magic==b"glTF" and version==2 and size==len(raw),p
            length,kind=struct.unpack_from("<I4s",raw,12)
            assert kind==b"JSON"
            scene=json.loads(raw[20:20+length])
            assert scene.get("meshes") and scene.get("nodes"),p
            required=scene.get("extensionsRequired",[])
            assert "EXT_meshopt_compression" not in required,(p,required)
            tris=0
            for mesh in scene.get("meshes",[]):
              for prim in mesh.get("primitives",[]):
                inds=prim.get("indices")
                if inds is not None and prim.get("mode",4)==4: tris+=scene["accessors"][inds]["count"]//3
            material_count=len(scene.get("materials",[]))
            assert tris>1000,(p,tris)
            reports.append({"model":item["folder"],"source":item["url"],"license":item["license"],"triangles_optimized_mesh":tris,"materials":material_count,"glb_bytes":len(raw),"meshopt_decoded":True,"mesh_count":len(scene["meshes"]),"qa_status":"Structural export validated; photorealism and legal logo review pending"})
            print(item["folder"],tris,"triangles",material_count,"materials",len(raw),"bytes")
          assert len(reports)==5
          (root/"VALIDATION.json").write_text(json.dumps(reports,indent=2)+"\n")
          PY
      - name: Avoid storage of duplicate compressed source meshes
        run: find third_party/Sports_Batch_02 -name source_meshopt.glb -delete
      - name: Commit verified 5 mesh exports and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/Sports_Batch_02
          if git diff --cached --quiet; then
            echo "Existing exports already up-to-date"
          else
            git commit -m "Import 5 commercially CC-licensed Porsche sports models and validate mesh exports"
            git push
          fi
